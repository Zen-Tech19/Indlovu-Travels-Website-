<form class="enq" id="enquiry" novalidate>
<h2>Booking enquiry</h2>
<div class="row2">
<div><label for="name">Name</label><input id="name" name="name" autocomplete="name" required><div class="err" id="err-name" role="alert"></div></div>
<div><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email" required><div class="err" id="err-email" role="alert"></div></div>
</div>
<div class="row2">
<div><label for="phone">Phone number</label><input id="phone" name="phone" type="tel" autocomplete="tel" required><div class="err" id="err-phone" role="alert"></div></div>
<div><label for="service">Service interested in</label><select id="service" name="service" required><option value="">Choose a service</option><option>Guided tours</option><option>Wellness retreats</option><option>Wildlife safaris</option><option>Kayaking and canoeing</option><option>Conservation experiences</option><option>Family adventure packages</option><option>Catering and picnic experiences</option><option>Accommodation services</option><option>Transport services</option><option>Corporate retreats and conferencing</option><option>Adventure activities</option><option>Something else / not sure yet</option></select><div class="err" id="err-service" role="alert"></div></div>
</div>
<div class="row2">
<div><label for="guests">Number of guests</label><input id="guests" name="guests" type="number" min="1" inputmode="numeric"></div>
<div><label for="dates">Preferred dates</label><input id="dates" name="dates" placeholder="e.g. 12 to 15 December"></div>
</div>
<label for="message">Message</label>
<textarea id="message" name="message" required></textarea><div class="err" id="err-message" role="alert"></div>
<div class="btn-row"><button class="btn btn-gold" type="submit">Send by email</button><button class="btn btn-wa" type="button" id="send-wa">Send via WhatsApp</button></div>
<p class="form-note" id="form-status" role="status">This sends an enquiry only. It does not check availability, quote prices or reserve a date. We use your details only to reply to your enquiry.</p>
</form>
